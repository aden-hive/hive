# Glimmer Isle, in English: every word this story says that the engine does not.
# The mechanics are in ../rules.toml, the pictures in ../art.toml; places, omens and the calendar in
# world.toml; the people in agents/; the truth in truth.md.

[story]
id = "glimmer"
lang = "en"
title = "Glimmer Isle"
vale = "Glimmer Isle"
world = "the isle"
premise = "watching the islanders race to relight a lighthouse that has been dark for nineteen years before Lantern Night, so the island's scattered children can follow its light home"
blurb = "A small island in a warm sea. Its lighthouse has been dark for nineteen years: the keeper took the great lens apart into seven prisms and gave them to seven households, saying that when the island was one again, they should put her back together. Ten islanders, each a Hive agent, have a month to light it before Lantern Night, so the children who left can follow its beam home."
river = "The sea is all around; paths climb the slopes between the seven places."

[gods]
names = { world = "the isle", god = "the Sea Mother", overgod = "the Sky Lamp" }
titles = { god = "the Sea Mother" }
above_words = ["sky lamp", "lamp in the sky", "above", "sky", "天灯"]

[gods.pray]
god = "'the Sea Mother' (the sea the island has honoured for generations)"
above = "'the Sky Lamp' (the voice brighter than any lighthouse, which you have heard)"

[persona]
want = "What you want"
rules = "Rules you live by"
deeper = "Deeper still"

[place_aliases]
lighthouse = "cape"
cape = "cape"
cottage = "cape"
orchard = "orchard"
slope = "orchard"
hut = "orchard"
hives = "apiary"
apiary = "apiary"
teahouse = "steps"
steps = "steps"
square = "steps"
pier = "harbour"
harbour = "harbour"
harbor = "harbour"
workshop = "harbour"
school = "school"
schoolhouse = "school"
cave = "caves"
caves = "caves"
echo = "caves"

[professions.fisher]
hint = "go out fishing"
makes = { fish = 2 }
deed = "came back from the sea with a basket of fish"
[professions.orchardist]
hint = "tend the fruit trees and pick fruit"
makes = { fruit = 2 }
deed = "tended the trees and picked a basket of fruit"
[professions.beekeeper]
hint = "tend the hives, take honey and wax"
makes = { honey = 1, wax = 1 }
deed = "tended the hives and took honey and wax"
[professions.tinker]
hint = "mend things in the workshop"
makes = { gears = 1 }
deed = "tinkered in the workshop and mended something"
[professions.teacher]
hint = "teach the children, write letters for people"
deed = "taught the children a lesson"
[professions.teahouse]
hint = "brew tea and look after guests"
makes = { tea = 2 }
deed = "brewed tea and looked after guests"
[professions.merchant]
hint = "trade"
makes = { coin = 2 }
deed = "made a small deal"
[professions.keeper]
hint = "sweep the lighthouse"
deed = "swept the lantern room and the cottage"
[professions.child]
hint = "play, and run errands for the grown-ups"
deed = "ran an errand for the grown-ups"

# Goods: the name a villager reads, other names they may use, and words that mean it inside a longer name.
[items]
prism = { name = "prism", aliases = ["prisms", "rainbow stone", "glass float", "float", "paperweight", "lens", "wing-shaped glass", "wing glass"], match = ["\\b(prisms?|rainbow stones?|floats?|paperweights?|lens|wing-shaped)\\b", "棱镜|彩虹石|浮子|镇纸"] }
oil = { name = "fish oil", aliases = ["oil", "lamp oil"], match = ["\\boil\\b"] }
wax = { name = "beeswax", aliases = ["wax"], match = ["\\b(bees)?wax\\b"] }
honey = { name = "honey", match = ["\\bhoney\\b"] }
fish = { name = "fish", match = ["\\bfish\\b(?! oil)"] }
fruit = { name = "fruit", aliases = ["apples", "apple", "fruits"], match = ["\\b(fruits?|apples?)\\b"] }
tea = { name = "tea", match = ["\\btea\\b(?!house)"] }
coin = { name = "coin", aliases = ["coins", "money", "silver"], match = ["\\b(coins?|money|silver)\\b"] }
rope = { name = "rope", aliases = ["ropes"], match = ["\\bropes?\\b"] }
lantern = { name = "lantern", aliases = ["lanterns", "paper lantern"], match = ["\\blanterns?\\b"] }
paper = { name = "paper", aliases = ["coloured paper", "lantern paper"], match = ["\\bpaper\\b"] }
gears = { name = "brass parts", aliases = ["gears", "gear", "parts", "escapement fork"], match = ["\\b(gears?|brass parts?|escapement)\\b"] }
resin = { name = "pine resin", aliases = ["resin"], match = ["\\bresin\\b"] }
letter = { name = "letter", aliases = ["letters", "old letter"], match = ["\\bletters?\\b"] }
key = { name = "key", aliases = ["keys"], match = ["\\bkeys?\\b"] }
cloth = { name = "cloth", match = ["\\bcloth\\b"] }

# Topics, and the words that raise them. An islander's interests are weights on these topics.
[lexicon]
light = ["lighthouse", "light", "lamp", "beam", "lantern room", "wick", "shine", "灯塔"]
glass = ["prism", "rainbow", "glass", "float", "paperweight", "lens", "wing-shaped"]
sea = ["sea", "boat", "tide", "wave", "pier", "harbour", "dolphin", "whale", "sail"]
festival = ["lantern night", "lanterns", "festival", "feast", "midsummer", "celebration"]
family = ["daughter", "son", "granddaughter", "grandmother", "mother", "father", "family"]
feud = ["quarrel", "grudge", "feud", "stone wall", "both families", "forgive", "sorry", "blame"]
home = ["come home", "coming home", "return", "mainland", "left the island", "letter", "home"]
bees = ["bee", "bees", "honey", "wax", "hive", "flowers"]
orchard = ["orchard", "fruit", "tree", "watch-hut", "apple"]
craft = ["mend", "repair", "clockwork", "gear", "workshop", "escapement", "drawing", "brass"]
school = ["school", "book", "read", "teacher", "lesson", "letters"]
money = ["money", "coin", "buy", "sell", "price", "deal", "hotel"]
storm = ["storm", "gale", "fog", "rain", "ebb", "spring tide"]
children = ["child", "children", "xiaoman", "kid", "pupils"]
song = ["song", "sing", "lamplighting", "tune"]
keeper = ["granny lamp", "chaoyin", "keeper", "logbook", "promise", "put me back together"]
help = ["help", "please", "need", "come quick", "can you", "will you"]
