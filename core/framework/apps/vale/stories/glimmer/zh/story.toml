# 每样知识，主持人被告知的说法（sheet.toml 的 `knows`，或细看所得）。
[knows]
keeper_heir = "是守灯人潮音的孙女，带着祖母留下的一封短信（只有一句：“把我拼回来”）和灯塔的钥匙"
promise = "读过守灯日志里潮音的约定：七家七片光——海家的船、坡家的棚、茶坊的风、学堂的纸、蜜家的火、睡着的孩子，还有一片还给了海；等岛又成了一个，把她拼回来"
escapement = "见过《灯塔机芯图说》里擒纵叉的图样，齿数和尺寸都清清楚楚"
clockwork = "四十年前修过灯塔的转镜机芯，记得它的每一个齿；有了擒纵叉的图样，就能把机芯修好"
lamp_oil = "知道守灯人的灯油怎么调：蜂蜡三分、鱼油七分、松脂一撮，灯芯要用麻搓"
lantern_song = "会唱灯会的老歌《点灯谣》，也会扎竹骨灯笼"
climber = "什么都爬得上去，灯塔的外壁也不怕"
boatman = "风浪再大也划得动船，认得岛周围每一块暗礁"
cave_prism = "看见了潮洞回声室石架上包着油布的那块翅膀形玻璃（只有大退潮时进得去）"
letter = "怀里揣着一封十九年前小澜托他带给母亲海婶、他却一直没送出去的信"
elopement = "十九年前灯会那一夜，是他划船把小澜和阿桐送上了去大陆的夜船"
literate = "识字"
mainland = "在大陆的港口城里住了很多年，知道离岛的人都去了哪里"

# 命运可以改变什么。type 和键名是引擎的，必须原样照写；说明是故事的。
[fate]
effects = '''  {"type": "set_prism", "who": "<交出棱镜的人物 id>"}  —— 一块棱镜被带上灯室，嵌回镜框（此人必须带着一块棱镜）
  {"type": "lamp", "amount": 0.1 到 0.5}  —— 大灯的灯油和灯芯备得更足（要用蜂蜡、鱼油、松脂）
  {"type": "clock", "amount": 0.1 到 0.5}  —— 转镜的机芯修好一些（要有擒纵叉的图样和巧手）
  {"type": "light"}  —— 灯塔重新亮起（只有七块棱镜齐全、灯油和机芯都备好时才会成）
  {"type": "festival", "amount": 0.03 到 0.3}  —— 灯会准备得更好：灯笼、吃食、歌
  {"type": "harmony", "amount": -0.2 到 0.25}  —— 记的是做成的事，不是谁的心思：凡是做成了弥合旧隔阂的事（石墙上开了口子、旧信送到或当众读出、两家同席吃饭、帮了另一家、当众说出实情），或加深隔阂的事（争吵、背弃），就用它；小事约 0.05，大事 0.1 到 0.25
  {"type": "item", "who": "<人物 id>", "item": "<物品 id：prism（棱镜）、oil（鱼油）、wax（蜂蜡）、honey（蜂蜜）、fish（鱼）、fruit（果子）、tea（茶）、coin（铜钱）、rope（绳子）、lantern（灯笼）、paper（纸）、gears（铜件）、resin（松脂）、cloth（布）>", "qty": <正数为得到，负数为失去>}
  {"type": "health", "who": "<人物 id>", "change": 1（受了伤或累倒）或 -1（好转）}
  {"type": "tie", "a": "<人物 id>", "b": "<人物 id>", "change": -0.5 到 0.5}  —— a 现在对 b 的感情变化
  {"type": "reveal", "text": "<从此在场所有人都看得明明白白的事>"}'''

