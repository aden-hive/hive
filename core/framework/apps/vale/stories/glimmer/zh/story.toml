# 萤屿，中文：这个故事里引擎不管的一切词语。
# 机制在 ../rules.toml，画在 ../art.toml；地点、征兆和日历在 world.toml；人物在 agents/；真相在 truth.md。

[story]
id = "glimmer"
lang = "zh"
title = "萤屿"
vale = "萤屿"
world = "萤屿"
premise = "看着岛民们赶在灯会之前把黑了十九年的灯塔重新点亮，让离岛的孩子们循着光回家"
blurb = "暖海边上的一座小岛。灯塔黑了十九年：守灯人把大镜拆成七片光，分给了七户人家，说等岛又成了一个，再把她拼回来。十位岛民，每一位都是一个 Hive 智能体，有一个月的时间赶在灯会之前点亮它，让散落在外的孩子们循着光回家。"
river = "岛的四周都是海；路沿着坡地把七处地方连起来。"

[gods]
names = { world = "萤屿", god = "海母", overgod = "天灯" }
titles = { god = "海母" }
above_words = ["天灯", "天上的灯", "天上", "上天", "sky lamp", "above"]

[gods.pray]
god = "“海母”（岛上世世代代敬着的海）"
above = "“天灯”（那个比灯塔还亮、你听见过的声音）"

[persona]
want = "你想要什么"
rules = "你的处世规则"
deeper = "更深的秘密"

[place_aliases]
"灯塔" = "cape"
"岬角" = "cape"
"守灯人的小屋" = "cape"
"果园" = "orchard"
"看守棚" = "orchard"
"蜂箱" = "apiary"
"花坡" = "apiary"
"茶坊" = "steps"
"石阶" = "steps"
"广场" = "steps"
"码头" = "harbour"
"港口" = "harbour"
"渔港" = "harbour"
"工坊" = "harbour"
"学校" = "school"
"教室" = "school"
"洞" = "caves"
"海蚀洞" = "caves"
"回声室" = "caves"

# 每门手艺干活时做出什么，以及干活的人被告知做了什么。
[professions.fisher]
hint = "出海打鱼"
makes = { fish = 2 }
deed = "出海打回了一篓鱼"
[professions.orchardist]
hint = "照看果树、摘果子"
makes = { fruit = 2 }
deed = "照看了果树，摘了一筐果子"
[professions.beekeeper]
hint = "照看蜂箱，取蜜取蜡"
makes = { honey = 1, wax = 1 }
deed = "照看了蜂箱，取了蜜和蜡"
[professions.tinker]
hint = "在工坊修东西"
makes = { gears = 1 }
deed = "在工坊里敲敲打打，修好了一件东西"
[professions.teacher]
hint = "教孩子们读书写字，替人写信"
deed = "给孩子们上了一堂课"
[professions.teahouse]
hint = "煮茶招呼客人"
makes = { tea = 2 }
deed = "煮了茶，招呼了客人"
[professions.merchant]
hint = "做买卖"
makes = { coin = 2 }
deed = "做了一笔小买卖"
[professions.keeper]
hint = "打扫灯塔"
deed = "把灯室和小屋打扫了一遍"
[professions.child]
hint = "玩，帮大人跑腿"
deed = "帮大人跑了一趟腿"

# 物品：村民读到的名字、他们可能用的别名，以及在长名字里指代它的词。中文按子串匹配。
[items]
prism = { name = "棱镜", aliases = ["彩虹石", "玻璃浮子", "浮子", "镇纸", "透镜", "翅膀形玻璃", "翅膀玻璃", "那片光"], match = ["棱镜|彩虹石|浮子|镇纸|透镜|翅膀形", "\\bprisms?\\b"] }
oil = { name = "鱼油", aliases = ["灯油", "油"], match = ["鱼油|灯油", "\\boil\\b"] }
wax = { name = "蜂蜡", aliases = ["蜡"], match = ["蜂蜡|蜡", "\\bwax\\b"] }
honey = { name = "蜂蜜", aliases = ["蜜"], match = ["蜂蜜|蜜", "\\bhoney\\b"] }
fish = { name = "鱼", aliases = ["鲜鱼", "干鱼"], match = ["(?<![鱼])鱼(?!油)", "\\bfish\\b"] }
fruit = { name = "果子", aliases = ["苹果", "水果"], match = ["果子|苹果|水果", "\\bfruits?\\b"] }
tea = { name = "茶", aliases = ["茶叶"], match = ["茶叶|(?<![茶])茶(?![坊婆])", "\\btea\\b"] }
coin = { name = "铜钱", aliases = ["钱", "铜板", "银子"], match = ["铜钱|铜板|银子|钱", "\\bcoins?\\b"] }
rope = { name = "绳子", aliases = ["绳", "绳索"], match = ["绳", "\\bropes?\\b"] }
lantern = { name = "灯笼", aliases = ["纸灯笼"], match = ["灯笼", "\\blanterns?\\b"] }
paper = { name = "纸", aliases = ["彩纸", "灯笼纸"], match = ["(?<![报])纸", "\\bpaper\\b"] }
gears = { name = "铜件", aliases = ["齿轮", "零件", "擒纵叉"], match = ["铜件|齿轮|零件|擒纵叉", "\\bgears?\\b"] }
resin = { name = "松脂", match = ["松脂", "\\bresin\\b"] }
letter = { name = "信", aliases = ["书信", "旧信"], match = ["(?<![相])信(?![号])", "\\bletters?\\b"] }
key = { name = "钥匙", match = ["钥匙", "\\bkeys?\\b"] }
cloth = { name = "布", aliases = ["布料"], match = ["布", "\\bcloth\\b"] }

