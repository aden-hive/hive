# 灰湖谷，中文版：故事里引擎不管的一切都在这里。
# 地点、征兆和日历在 world.toml；人物在 agents/；真相在 truth.md。
# 键名、地点 id、人物 id 和物品 id 与英文版相同，引擎只认这些。

[story]
world = "山谷"
premise = "看着村民们在龙锈之害中熬过一个月"
id = "ashmere"
lang = "zh"
title = "灰湖谷"
vale = "灰湖谷"
blurb = "十五位村民，每一位都是一个 Hive 智能体，各有过往、秘密和角色卡，要在龙锈之害中熬过一个月。三位神明看顾着他们：正神、星神和古神乌勒尔。而你，在这三者之上。"
river = "空溪发源于灰牙矿，流经空溪磨坊和灰湖，向下直到芬渡；涨水时会漫进沼林。"

[gods]
names = { world = "山谷", god = "神", outer = "星神", ullr = "乌勒尔", overgod = "至上者" }
titles = { god = "正神", outer = "星神", ullr = "古神乌勒尔" }
follower = "bagel"          # 星神的仆从：只有她能向星神祈祷
chosen = "wynn"             # 古神乌勒尔的神选之子，正神看不见她
hidden_from_god = ["true_voice"]
master_words = ["主人", "星神", "master", "pleiades"]
ullr_words = ["乌勒尔", "古神", "ullr", "old god"]
above_words = ["至上", "上天", "天上", "苍天", "声音", "above", "voice", "sky"]
high_places = ["barrow_hill", "fold", "mirewood"]

# Whom a villager may pray to, as the pray tool names them.
[gods.pray]
god = "“神”（礼拜堂里的正神）"
ullr = "“乌勒尔”（山岭的古神）"
outer = "“主人”（只属于你一个人）"
above = "“至上者”（那个高于一切声音的声音，你听见过）"

[persona]
want = "你想要什么"
rules = "你的处世规则"
deeper = "更深的秘密"

