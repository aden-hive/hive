# 命运可以改变什么。type 和键名是引擎的，必须原样照写；说明是故事的。
[fate]
effects = '''  {"type": "seal_shaft"}  —— 深巷道里的破口重新封上
  {"type": "reopen_shaft"}
  {"type": "raise_stone"}  —— 古冢丘上倒下的那块石头重新立起来
  {"type": "sing", "verses": 1 或 2}  —— 在七石之间唱起牧歌（两段都唱、石头又已立起时，古神乌勒尔的权柄会醒来一阵）
  {"type": "purify", "place": "<地点 id>", "amount": 0.05 到 0.3}  —— 那里的水暂时变干净一些
  {"type": "heal", "place": "<地点 id>", "amount": 0.05 到 0.4}  —— 那里的病人好转一些
  {"type": "wolves", "result": "driven_off" | "killed" | "failed"}
  {"type": "item", "who": "<人物 id>", "item": "<物品 id：water（一罐清水）、jars（罐子）、timber（木材）、rope（绳子）、lamps（灯）、tools（工具）、remedy（药剂）、herbs（草药）、moonwort（月草）、map（地图）、coin（铜币）、bread（面包）、ore（矿石）、wool（羊毛）、flour（面粉）、ale（麦酒）或 game（野味）>", "qty": <正数为得到，负数为失去>}
  {"type": "health", "who": "<人物 id>", "change": 1（更糟）或 -1（好转）}
  {"type": "confine", "who": "<人物 id>", "days": 1 到 3}  —— 被关进荆堡
  {"type": "tie", "a": "<人物 id>", "b": "<人物 id>", "change": -0.5 到 0.5}  —— a 现在对 b 的感情变化
  {"type": "reveal", "text": "<从此在场所有人都看得明明白白的事>"}'''

