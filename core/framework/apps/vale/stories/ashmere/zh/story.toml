[overgod.secrets]
aldric = "奥德里克爵士以为四下无人，展开一张磨旧的纸：多年来以他的名义为一个弃婴付的学费，底下是一个女人的笔迹写的一个名字：“伊索尔德”。"
bagel = "贝果跪下时，她最新那幅画上的颜料从里面亮了起来，仿佛天外极远处有谁正透过它往这边看，满天星辰似乎都转向她面朝的方向。"
bram = "老布拉姆的袖子在门柱上挂破了，前臂露出一个旧烙印：铁连队的交叉双斧。有人想起了那首歌谣——杀死霍尔特恐狼的铁手布拉姆。"
brannoc = "一张折好的纸从布兰诺克的外衣里掉出来：一份王家工兵的退役文书，在哈勒围城时签发，上面写着他和哈尔·韦恩赖特的名字。"
cedric = "塞德里克的货里有个封好的木桶渗了：桶塞上冒出一颗颗红卤水，一股铁味，签条上写着“交炼金术士。货到付四十金币。”"
elspeth = "埃尔斯佩丝以为没人看见，把双手按在一个发热的额头上；高热从病人脸上退去，明明白白地升到了她自己脸上，她晃了一晃。"
gytha = "吉莎低声咒骂，把伊索尔德嬷嬷叫作烧了卡罗、毒了芬尼克那口井的女巫，又把老布拉姆叫作她的父亲。"
hal = "哈尔的外衣敞开，一张旧地图滑出来一半：老国王的工程师绘制的灰牙矿和古冢丘底下的坑道图，上面用红笔标着一条干燥的平硐。"
isolde = "伊索尔德嬷嬷面前的一支蜡烛火苗乱晃，她两指一并、念了一个字，不碰烛火就让它定住了：这是高阶法师的手法，一个女修院长不该会。"
kell = "有人听见凯尔低声对狗说，老布拉姆从前就是铁手布拉姆，那个杀了霍尔特恐狼的人。"
marta = "玛尔塔用一根弯针打开了一扇锁着的门，比倒一杯麦酒还快：这是“提灯”的手法，王都最出名的神偷。"
maud = "莫德一慌，说漏了嘴：三十二年前她是圣文娜礼拜堂接生婆的帮手，见过一个新生儿的襁褓里系着一枚印章戒指——闭门之上的一枝荆棘。"
osric = "一封信从奥斯里克的账本里掉出来：是他临终的母亲写的，说荆堡的老领主是他的父亲；信后面别着多年来以奥德里克名义为托拜厄斯·奎尔付的学费。"
tobias = "一枚戒指连着绳子从托拜厄斯的衣领里滑了出来：闭门之上的一枝荆棘，正是荆堡大门上方刻着的家纹。"
wynn = "温不经意地哼起她祖父的调子，大地应和了：山底下传来低沉的嗡鸣，在场每个人的脚底都感觉得到。"

