# 每门手艺干活时做出什么，以及干活的人被告知做了什么。
[professions.miller]
hint = "在磨坊磨面"
makes = { flour = 2 }
deed = "磨了一批面粉"
[professions.foreman]
hint = "带着矿工在灰牙矿采矿"
makes = { ore = 2 }
deed = "让矿工们从新巷道里运出了矿石"
at = "mine"
away = "你的矿工和镐头都在灰牙矿"
[professions.herbwife]
hint = "在小屋采月草、熬药"
makes = { moonwort = 1, remedy = 1 }
deed = "采了月草，熬了一剂药"
at = "home"
away = "你的草药和蒸锅都在自家小屋里"
[professions.hunter]
hint = "进林子打猎"
makes = { game = 1 }
deed = "从林子里带回了野味"
[professions.shepherd]
hint = "照看羊群"
makes = { wool = 1 }
deed = "照看了羊群"
[professions.trader]
hint = "在摊位上做买卖"
makes = { coin = 2 }
deed = "在摊位上做了点小买卖"
[professions.tavern]
hint = "酿酒、招呼客人"
makes = { ale = 2 }
deed = "酿了酒，招呼了客人"
[professions.steward]
hint = "管账"
makes = { coin = 3 }
deed = "理了一阵账目"
[professions.courier]
hint = "跑腿挣铜币"
makes = { coin = 1 }
deed = "跑了趟腿，挣了一枚铜币"
[professions.scribe]
hint = "替人写信、抄书挣铜币"
makes = { coin = 1 }
deed = "替人写了封信，挣了一枚铜币"
[professions.prioress]
hint = "领人祈祷，照管礼拜堂"
deed = "在礼拜堂领众人祈祷"
[professions.lord]
hint = "升堂理事，照管城堡"
deed = "升堂理事"
[professions.reeve]
hint = "听人诉苦，记好草坪木桩上的账"
deed = "听了几桩诉苦，更新了草坪木桩上的记数"
[professions.healer]
hint = "用草药或月草制药"
nothing = "你没有草药或月草可以制药"
recipes = [
  { uses = { moonwort = 1 }, makes = { remedy = 2 }, deed = "用月草熬了两剂药" },
  { uses = { herbs = 1 }, makes = { remedy = 1 }, deed = "用自己的草药做了一剂药" },
]
[professions.painter]
hint = "作画（用 paint 动作）"

# 物品：村民读到的名字、他们可能用的别名，以及在长名字里指代它的词。
# 第一个匹配上的物品胜出，所以水排在装它的罐子前面。中文按子串匹配，单字要小心：
# “药”会吞掉“药草”，所以药剂只认成词的说法；“药水”“墨水”不算水。
[items]
water = { name = "水", aliases = ["清水", "净水", "一罐水", "一罐清水", "泉水", "井水"], match = ["(?<![药墨汤])水(?![车道渠])", "\\bwater\\b"] }
jars = { name = "罐子", aliases = ["罐", "陶罐", "带盖的罐子", "坛子", "瓮", "器皿"], match = ["罐|坛|瓮|瓶|器皿", "\\b(jars?|vessels?|crocks?|pots?)\\b"] }
timber = { name = "木材", aliases = ["木头", "木料", "木梁", "横梁", "木板"], match = ["木材|木料|木头|木梁|横梁|梁木|木板|木垛|支架|撑木|支柱", "\\b(timbers?|beams?|planks?|cribbing|cribs?|braces?|props?|shores?)\\b"] }
rope = { name = "绳子", aliases = ["绳", "绳索", "麻绳"], match = ["绳", "\\bropes?\\b"] }
lamps = { name = "灯", aliases = ["油灯", "灯笼", "矿灯", "提灯"], match = ["油灯|灯笼|矿灯|马灯|灯盏|(?<!溺)灯(?!馆)", "\\b(lamps?|lanterns?)\\b"] }
tools = { name = "工具", aliases = ["撬棍", "撬杠", "杠杆", "家伙什"], match = ["工具|撬棍|撬杠|杠杆|镐|铁锹|铲|锤", "\\b(tools?|levers?|picks?|crowbars?|shovels?)\\b"] }
remedy = { name = "药剂", aliases = ["药", "汤药", "药汤", "药水", "药膏", "解药"], match = ["药剂|汤药|药汤|药水|药膏|膏药|解药|良药|补药|药丸|(?<!草)药(?!草)", "\\b(remed\\w*|draughts?|tonics?|salves?|medicines?)\\b"] }
moonwort = { name = "月草", aliases = ["白根月草"], match = ["月草", "\\bmoonwort\\b"] }
herbs = { name = "草药", aliases = ["药草"], match = ["草药|药草", "\\bherbs?\\b"] }
map = { name = "地图", aliases = ["工程师的地图", "旧地图", "隧道图", "坑道图", "图纸"], match = ["地图|图纸|舆图|坑道图|隧道图", "\\bmaps?\\b"] }
coin = { name = "铜币", aliases = ["钱", "铜板", "银币", "银子", "硬币"], match = ["铜币|银币|金币|铜板|银子|硬币|钱", "\\b(coins?|silver|coppers?)\\b"] }
bread = { name = "面包", aliases = ["一条面包", "饼"], match = ["面包|饼", "\\b(bread|loaf|loaves)\\b"] }
ore = { name = "矿石", aliases = ["矿", "矿砂"], match = ["矿石|矿砂|龙铁", "\\bore\\b"] }
wool = { name = "羊毛", match = ["羊毛", "\\bwool\\b"] }
flour = { name = "面粉", aliases = ["麦粉"], match = ["面粉|麦粉", "\\bflour\\b"] }
ale = { name = "麦酒", aliases = ["酒", "啤酒"], match = ["麦酒|啤酒|(?<![^\\s])酒(?!馆)", "\\bale\\b"] }
candles = { name = "蜡烛", aliases = ["烛"], match = ["蜡烛|烛", "\\bcandles?\\b"] }
game = { name = "野味", aliases = ["猎物"] }
goods = { name = "货物", aliases = ["货"] }
ink = { name = "墨水", aliases = ["墨"] }
paints = { name = "颜料", aliases = ["油彩"] }

