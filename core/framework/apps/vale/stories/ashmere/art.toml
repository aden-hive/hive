# The map: the Hollowbrook's course (points [owner place, x, y]; each stretch is coloured by its
# owner's water, from rules.toml [scene]) and where it spills into the Mirewood in flood.
[map]
streams = [{ points = [["mine", 16, 25], ["", 20, 36], ["mill", 25, 44], ["", 36, 52], ["ashmere", 44, 58], ["", 38, 70], ["fenford", 32, 80]] }]
floods = [{ owner = "mirewood", points = [[36, 52], [50, 66], [60, 74]] }]
