# The Vale of Ashmere, drawn: how each villager's portrait and each place's picture is made.
# The same in every language. The page draws them; a story may instead give a painted
# picture with `image = "people/hal.png"` (a file under this story's art/ folder).
#
# People: skin, hair (colour), style (short, long, bun, braids, wild, receding, slick, none),
# beard (none, stubble, full, long, goatee), hat (none, cap, scarf, circlet, miner, wimple,
# hat, merchant, hood), coat, trim (a second colour), age (young, adult, old), and extras:
# flour, quill, apron, fur, bow, herbs, maid, fox.
# Places: kind (mine, keep, mill, village, chapel, stones, pasture, forest, ford) and
# `water` when the blight shows in its stream.

[people.hal]
color = "#c98b2b"
skin = "#e8b88f"
hair = "#7a5230"
style = "short"
beard = "stubble"
hat = "cap"
coat = "#c98b2b"
trim = "#efe4cc"
age = "adult"
extras = ["flour"]

