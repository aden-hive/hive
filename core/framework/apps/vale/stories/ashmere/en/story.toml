# The One Above: what its powers are called, and what the vale sees when they land.
[overgod]
powers = { whisper = ["Whisper", "A dream to one villager, in the voice above every voice. Those who hear it can pray to you."], inscribe = ["Inscribe", "Words in letters of light above the Ledger, read by everyone whenever they act."], sign = ["Sign", "A wonder at one place, seen by everyone there."], prophecy = ["Prophecy", "A voice from the sky, heard by the whole vale."], reveal = ["Bring to light", "A villager's hidden secret shows itself before whoever is with them."], collector = ["The collector", "The crown's collector arrives at Thornkeep, weeks early, for the debt."], flood = ["Flood", "The Hollowbrook bursts its banks: blight spreads to the Mirewood and Fenford, and fever with it."], plague = ["Plague", "A fever sweeps one place."], wildfire = ["Wildfire", "The Mirewood burns; the wolves are driven to the fold."], raiders = ["Raiders", "Raiders strike one place: goods taken, people hurt."], winter = ["Hard winter", "Three days of snow: roads slow, and the dawn gives less strength."], earthquake = ["Earthquake", "The earth shakes: the deep door's seal may crack and the stone may fall again."], decree = ["Decree", "Lay your will on one of the vale's gods for some days; they cannot refuse it."], wake_ullr = ["Wake Ullr", "Wake old Ullr's authority for three nights, sung or not."], bind_star = ["Bind the Star God", "The Star God cannot reach the vale for some days."], heal = ["Heal", "Every sick body at one place is made whole."], cleanse = ["Cleanse", "The water at one place runs clean."], raise_stone = ["Raise the stone", "The fallen seventh stone stands again."] }
chapters = { voice = ["The Voice Above", "Make someone in the vale pray to you, the One Above."], wound = ["The Wound", "The deep door under Greyfang is shut."], song = ["The Old Song", "The shepherd's song is sung among the stones with both verses."], waking = ["The Waking", "Old Ullr's authority wakes."] }
