[overgod.secrets]
aldric = "Ser Aldric, thinking himself alone, unfolds a worn paper: years of payments for a foundling's schooling, made in his name, and beneath them one word in a woman's hand: 'Isolde'."
bagel = "As Bagel kneels, the paint on her latest canvas glows from within, as if someone far beyond the sky were looking through it, and every star seems to turn the way she faces."
bram = "Old Bram's sleeve tears on a gate-post, and an old brand shows on his forearm: the crossed axes of the Iron Company. Someone remembers the ballad of Bram Ironhand, who killed the dire wolf of Holt."
brannoc = "A folded paper falls from Brannoc's coat: a royal sapper's discharge, signed at the siege of Harl, with his name and Hal Wainwright's on it."
cedric = "A sealed cask among Cedric's goods has wept: red brine beads at its bung, smelling of iron, and its tag reads 'For the alchemist. Forty gold on delivery.'"
elspeth = "Elspeth lays her hands on a fevered brow when she thinks nobody sees; the fever leaves the sick face and rises plainly into hers, and she sways."
gytha = "Gytha, cursing under her breath, calls Mother Isolde the witch who burned Carrow and poisoned Fennick's well, and calls Old Bram her father."
hal = "Hal's coat falls open and an old map slips half out: the tunnels under Greyfang and Barrow Hill, drawn by the old king's engineers, with a dry adit marked in red."
isolde = "A candle gutters before Mother Isolde, and she stills the flame with two fingers and a word, without touching it: a high mage's trick no prioress should know."
kell = "Kell is overheard telling the dogs, low, that Old Bram was once Bram Ironhand, who killed the dire wolf of Holt."
marta = "Marta lets herself through a locked door with a bent pin in less time than it takes to pour an ale: the trick of the Lantern, the capital's most famous burglar."
maud = "Maud, flustered, lets slip that thirty-two years ago she was the midwife's girl at Saint Wenna's, and saw a signet ring tied in a newborn's blanket: a thorn branch over a closed gate."
osric = "A letter falls from Osric's ledger: his dying mother's, naming the old lord of Thornkeep as his father; pinned behind it, years of payments for Tobias Quill's schooling, in Aldric's name."
tobias = "A ring slips from Tobias's collar on its cord: a thorn branch over a closed gate, the arms carved above Thornkeep's own gate."
wynn = "Wynn hums her grandfather's tune without thinking, and the ground answers: a low hum from under the hill, felt in the feet of everyone there."

