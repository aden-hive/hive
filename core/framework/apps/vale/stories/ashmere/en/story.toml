# The Vale of Ashmere, in English: everything this story says that the engine does not.
# The places, omens and calendar are in world.toml; the people in agents/; the truth in truth.md.

[story]
world = "the vale"
premise = "watching its villagers live through a month of blight"
id = "ashmere"
lang = "en"
title = "The Vale of Ashmere"
vale = "the Vale of Ashmere"
blurb = "Fifteen villagers, each a Hive agent with a past, a secret and a character sheet, live through a month of blight. Three gods watch over them: the True God, the Star God and old Ullr. You are above all three."
river = "The Hollowbrook flows from Greyfang Mine past the Mill and Ashmere down to Fenford; in flood it spills into the Mirewood."

[gods]
names = { world = "the vale", god = "God", outer = "pleiades", ullr = "Ullr", overgod = "the One Above" }
titles = { god = "the True God", outer = "the Star God", ullr = "old Ullr" }
follower = "bagel"          # the Star God's servant: only she may pray to him
chosen = "wynn"             # old Ullr's chosen, whom the True God cannot see
hidden_from_god = ["true_voice"]
master_words = ["master", "pleiades", "主人"]
ullr_words = ["ullr", "old god", "乌勒尔", "古神"]
above_words = ["above", "voice", "sky"]
high_places = ["barrow_hill", "fold", "mirewood"]

# Whom a villager may pray to, as the pray tool names them.
[gods.pray]
god = "'God' (the True God of the chapel)"
ullr = "'Ullr' (the old god of the hills)"
outer = "'master' (yours alone)"
above = "'the One Above' (the voice above every voice, which you have heard)"

[persona]
want = "What you want"
rules = "Rules you live by"
deeper = "Deeper still"

[place_aliases]
village = "ashmere"
green = "ashmere"
tavern = "ashmere"
keep = "thornkeep"
barrows = "barrow_hill"
stones = "barrow_hill"
shepherds_fold = "fold"
market = "fenford"
greyfang = "mine"
wood = "mirewood"

# What each trade makes when someone works, and what they are told it is.
[professions.miller]
hint = "grind flour at the mill"
makes = { flour = 2 }
deed = "ground a batch of flour"
[professions.foreman]
hint = "mine ore at Greyfang with your crew"
makes = { ore = 2 }
deed = "had the crew haul ore from the new gallery"
at = "mine"
away = "your crew and your picks are at Greyfang"
[professions.herbwife]
hint = "gather moonwort and brew remedies at your hut"
makes = { moonwort = 1, remedy = 1 }
deed = "gathered moonwort and brewed a remedy"
at = "home"
away = "your herbs and your still are back at your hut"
[professions.hunter]
hint = "hunt the forest"
makes = { game = 1 }
deed = "came back from the forest with game"
[professions.shepherd]
hint = "tend the flock"
makes = { wool = 1 }
deed = "tended the flock"
[professions.trader]
hint = "buy and sell at the stalls"
makes = { coin = 2 }
deed = "did a little trade at the stalls"
[professions.tavern]
hint = "brew and serve"
makes = { ale = 2 }
deed = "brewed and served"
[professions.steward]
hint = "keep the accounts"
makes = { coin = 3 }
deed = "worked at the accounts"
[professions.courier]
hint = "run errands for coin"
makes = { coin = 1 }
deed = "ran an errand for a copper"
[professions.scribe]
hint = "write letters and copy pages for coin"
makes = { coin = 1 }
deed = "wrote a letter for a copper"
[professions.prioress]
hint = "lead prayers and keep the chapel"
deed = "led prayers in the chapel"
[professions.lord]
hint = "hold court and see to the keep"
deed = "held court"
[professions.reeve]
hint = "hear complaints and keep the tally"
deed = "heard complaints and updated the tally on the green post"
[professions.healer]
hint = "make remedies from herbs or moonwort"
nothing = "you have no herbs or moonwort to make remedies from"
recipes = [
  { uses = { moonwort = 1 }, makes = { remedy = 2 }, deed = "brewed two remedies from moonwort" },
  { uses = { herbs = 1 }, makes = { remedy = 1 }, deed = "made a remedy from her herbs" },
]
[professions.painter]
hint = "paint (use the paint action)"

# Goods: the name a villager reads, other names they may use, and words that mean it inside a longer name.
# The first good whose words match a long name wins, so water beats the jar it is in.
[items]
water = { name = "water", match = ["\\bwater\\b"] }
jars = { name = "jars", aliases = ["jar", "covered jars", "covered jar", "vessels", "vessel", "covered vessels", "covered vessel", "crocks", "pots"], match = ["\\b(jars?|vessels?|crocks?|pots?)\\b"] }
timber = { name = "timber", aliases = ["wood", "timbers", "beams"], match = ["\\b(timbers?|beams?|planks?|cribbing|cribs?|braces?|props?|shores?)\\b"] }
rope = { name = "rope", aliases = ["ropes"], match = ["\\bropes?\\b"] }
lamps = { name = "lamps", aliases = ["lamp"], match = ["\\b(lamps?|lanterns?)\\b"] }
tools = { name = "tools", aliases = ["tool", "levers", "lever"], match = ["\\b(tools?|levers?|picks?|crowbars?|shovels?)\\b"] }
remedy = { name = "remedy", aliases = ["remedies"], match = ["\\b(remed\\w*|draughts?|tonics?|salves?|medicines?)\\b"] }
moonwort = { name = "moonwort", match = ["\\bmoonwort\\b"] }
herbs = { name = "herbs", aliases = ["herb"], match = ["\\bherbs?\\b"] }
map = { name = "map", aliases = ["engineers' map", "the map", "old map", "tunnel map", "maps"], match = ["\\bmaps?\\b"] }
coin = { name = "coin", aliases = ["coins", "silver", "silver coin", "copper", "coppers"], match = ["\\b(coins?|silver|coppers?)\\b"] }
bread = { name = "bread", aliases = ["loaf", "loaves"], match = ["\\b(bread|loaf|loaves)\\b"] }
ore = { name = "ore", aliases = ["ores"], match = ["\\bore\\b"] }
wool = { name = "wool", match = ["\\bwool\\b"] }
flour = { name = "flour", aliases = ["flours"], match = ["\\bflour\\b"] }
ale = { name = "ale", aliases = ["ales"], match = ["\\bale\\b"] }
candles = { name = "candles", aliases = ["candle"], match = ["\\bcandles?\\b"] }
game = { name = "game" }
goods = { name = "goods" }
ink = { name = "ink" }
paints = { name = "paints", aliases = ["paint"] }

