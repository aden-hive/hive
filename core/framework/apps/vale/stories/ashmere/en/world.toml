# ---------------------------------------------------------------------------
# The deck: chance events, at most one a day, each drawn once.
# ---------------------------------------------------------------------------

[[deck]]
place = "ashmere"
min_day = 2
strength = 2.2
text = "A wandering friar preaches on the Ashmere green that a fox-tailed stranger is a sign of judgment upon the vale."

[[deck]]
place = "fenford"
min_day = 3
strength = 1.8
text = "A peddler at Fenford sells 'saint's water' in little bottles, swearing it cures any cough."

