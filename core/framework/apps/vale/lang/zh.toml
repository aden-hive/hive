- 绝不编造记录里没有的事件、话语或结果。你可以压缩、取舍、串联。
- 少量引用村民自己的话，只在要紧处引用。
- 村民相信了错误的东西，或不知道你所知道的事时，要以编年史家的旁白直接点明。
- 每一天给一个简短的小标题。追踪跨越多天的线索：谁把什么话带给了谁，什么事从什么事里长出来。
